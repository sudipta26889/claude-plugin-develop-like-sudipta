name: e2e

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '__NODE_VERSION__'

      - name: Install dependencies
        run: __INSTALL_CMD__

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          __DEV_SERVER_START_CMD__ &
          echo $! > .e2e-dev-server.pid

      - name: Wait for dev server
        run: |
          if command -v npx >/dev/null 2>&1 && npx --no-install wait-on --version >/dev/null 2>&1; then
            npx wait-on --timeout 60000 __DEV_SERVER_URL__
          else
            # Fallback: poll with curl up to 60s
            i=0
            until curl -fsS __DEV_SERVER_URL__ >/dev/null 2>&1; do
              i=$((i + 1))
              if [ "$i" -ge 60 ]; then
                echo "dev server did not come up within 60s" >&2
                exit 1
              fi
              sleep 1
            done
          fi

      - name: Run Playwright tests
        run: __PKG_MANAGER__ exec playwright test --config=__PLAYWRIGHT_CONFIG__

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .e2e-dev-server.pid ]; then
            kill "$(cat .e2e-dev-server.pid)" 2>/dev/null || true
            rm -f .e2e-dev-server.pid
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
